name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (for Firebase emulator)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Run audit regression tests
        run: npm run test:audit

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Run Client Gateway Firestore integration tests
        run: npm run test:integration

      - name: Build production bundle
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APPCHECK_DEBUG_TOKEN: ""
        run: npm run build

      - name: Verify production bundle integrity
        run: npm run test:bundle

      - name: Verify production bundle excludes debug token and secret keys
        run: |
          if grep -rnE "VITE_APPCHECK_DEBUG_TOKEN|RECAPTCHA_SECRET_KEY" dist/; then
            echo "Error: Debug token env or secret key reference found in production bundle!"
            exit 1
          fi
          if grep -rn "FIREBASE_APPCHECK_DEBUG_TOKEN" dist/assets/index-*.js; then
            echo "Error: App Check debug token initialization found in app bundle!"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

  mobile-e2e:
    name: Mobile E2E (Pixel 7 & iPhone SE)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (for Firebase emulator)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium & WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile E2E tests (Pixel 7 & iPhone SE)
        run: npm run test:e2e:mobile

      - name: Upload Playwright report & failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mobile-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [verify, mobile-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TARGET_TAG="${REF_NAME}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_TAG="${INPUT_TAG}"
          fi

          if ! [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: ${TARGET_TAG}" >&2
            exit 1
          fi

          echo "Publishing release for tag: ${TARGET_TAG}"
          gh release create "${TARGET_TAG}" \
            --title "Transit Tag Game ${TARGET_TAG}" \
            --generate-notes \
            --verify-tag
