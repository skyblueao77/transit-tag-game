name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (for Firebase emulator)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Run audit regression tests
        run: npm run test:audit

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Run Client Gateway Firestore integration tests
        run: npm run test:integration

      - name: Build production bundle
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APPCHECK_DEBUG_TOKEN: ""
        run: npm run build

      - name: Verify production bundle integrity
        run: npm run test:bundle

      - name: Verify production bundle excludes debug token and secret keys
        run: |
          if grep -rnE "VITE_APPCHECK_DEBUG_TOKEN|RECAPTCHA_SECRET_KEY" dist/; then
            echo "Error: Debug token env or secret key reference found in production bundle!"
            exit 1
          fi
          if grep -rn "FIREBASE_APPCHECK_DEBUG_TOKEN" dist/assets/index-*.js; then
            echo "Error: App Check debug token initialization found in app bundle!"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TARGET_TAG="${REF_NAME}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_TAG="${INPUT_TAG}"
          fi

          if ! [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag format: ${TARGET_TAG}" >&2
            exit 1
          fi

          echo "Publishing release for tag: ${TARGET_TAG}"
          gh release create "${TARGET_TAG}" \
            --title "Transit Tag Game ${TARGET_TAG}" \
            --generate-notes \
            --verify-tag
