name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (for Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Run Client Gateway Firestore integration tests
        run: npm run test:integration

      - name: Build production bundle
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APPCHECK_DEBUG_TOKEN: ""
        run: npm run build

      - name: Verify production bundle excludes debug token and secret keys
        run: |
          if grep -rnE "VITE_APPCHECK_DEBUG_TOKEN|RECAPTCHA_SECRET_KEY" dist/; then
            echo "Error: Debug token env or secret key reference found in production bundle!"
            exit 1
          fi
          if grep -rn "FIREBASE_APPCHECK_DEBUG_TOKEN" dist/assets/index-*.js; then
            echo "Error: App Check debug token initialization found in app bundle!"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG="${{ inputs.tag }}"
          fi

          echo "Publishing release for tag: ${TARGET_TAG}"
          gh release create "${TARGET_TAG}" \
            --title "Transit Tag Game ${TARGET_TAG}" \
            --generate-notes \
            --verify-tag
