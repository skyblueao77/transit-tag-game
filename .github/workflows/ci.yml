name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (for Firebase emulator)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Run audit regression tests
        run: npm run test:audit

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Run Client Gateway Firestore integration tests
        run: npm run test:integration

      - name: Build production bundle
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APPCHECK_DEBUG_TOKEN: ""
        run: npm run build

      - name: Verify production bundle integrity
        run: npm run test:bundle

      - name: Verify production bundle excludes debug token and secret keys
        run: |
          if grep -rnE "VITE_APPCHECK_DEBUG_TOKEN|RECAPTCHA_SECRET_KEY" dist/; then
            echo "Error: Debug token env or secret key reference found in production bundle!"
            exit 1
          fi
          if grep -rn "FIREBASE_APPCHECK_DEBUG_TOKEN" dist/assets/index-*.js; then
            echo "Error: App Check debug token initialization found in app bundle!"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev
